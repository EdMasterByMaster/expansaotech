services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}
    ports:
      - "1433:1433"
    volumes:
      - expansaodb-data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  schema:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -i /schema.sql"]
    volumes:
      - ./sql/schema.sql:/schema.sql:ro

  app:
    build: .
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:sqlserver://db:1433;databaseName=Expansaodb;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_CPF: ${APP_ADMIN_CPF:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Administração Expansão}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  expansaodb-data:
