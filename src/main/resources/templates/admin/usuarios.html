<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários | Administração</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="section admin-page">
    <div class="section-heading section-heading-row">
        <div><p class="eyebrow">Acessos e equipe</p><h1>Usuários</h1></div>
        <a class="button button-primary" th:href="@{/admin/usuarios/novo}">Novo usuário</a>
    </div>
    <p th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}" role="status"></p>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Tipo</th><th>Ações</th></tr></thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nome}"></td><td th:text="${usuario.cpf}"></td><td th:text="${usuario.email}"></td>
                <td th:text="${usuario.tipo.valorBanco}"></td>
                <td class="table-actions">
                    <a class="text-link" th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                    <form th:action="@{/admin/usuarios/{id}/excluir(id=${usuario.id})}" method="post">
                        <button class="text-button danger" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${#lists.isEmpty(usuarios)}" class="empty-state">Nenhum usuário cadastrado.</p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
