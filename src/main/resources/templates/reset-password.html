<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir nova senha | Expansão Tech</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div th:replace="~{fragments/layout :: header}"></div>
<main class="login-card">
    <p class="eyebrow">Área administrativa</p>
    <h1>Definir nova senha</h1>
    <div th:if="${!tokenValido}">
        <p class="alert alert-error" role="alert">Este link é inválido ou expirou. Solicite uma nova redefinição.</p>
        <a class="button button-primary" th:href="@{/esqueci-senha}">Solicitar novo link</a>
    </div>
    <form th:if="${tokenValido}" th:action="@{/redefinir-senha}" th:object="${form}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="senha">Nova senha</label>
        <input id="senha" th:field="*{senha}" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <small class="field-error" th:errors="*{senha}"></small>
        <label for="confirmarSenha">Confirme a nova senha</label>
        <input id="confirmarSenha" th:field="*{confirmarSenha}" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <small class="field-error" th:errors="*{confirmarSenha}"></small>
        <p class="meta">A senha deve ter pelo menos 12 caracteres e respeitar o limite do armazenamento seguro.</p>
        <button class="button button-primary" type="submit">Salvar nova senha</button>
    </form>
    <p><a class="text-link" th:href="@{/login}">Voltar ao login</a></p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
