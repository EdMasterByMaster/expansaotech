<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | Expansão Tech</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div th:replace="~{fragments/layout :: header}"></div>
<main class="login-card">
    <p class="eyebrow">Área administrativa</p>
    <h1>Recuperar senha</h1>
    <p>Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar outra senha.</p>
    <p th:if="${param.solicitado}" class="alert alert-success" role="status">
        Se o e-mail informado estiver cadastrado, você receberá instruções para redefinir a senha.
    </p>
    <form th:action="@{/esqueci-senha}" th:object="${form}" method="post">
        <label for="email">E-mail</label>
        <input id="email" th:field="*{email}" type="email" autocomplete="email" required maxlength="100">
        <small class="field-error" th:errors="*{email}"></small>
        <button class="button button-primary" type="submit">Enviar instruções</button>
    </form>
    <p><a class="text-link" th:href="@{/login}">Voltar ao login</a></p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
